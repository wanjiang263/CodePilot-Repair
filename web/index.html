<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="google" content="notranslate" />
    <title>CodePilot-Repair</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("codepilot.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var storedLang = localStorage.getItem("codepilot.language");
          var browser = (navigator.languages && navigator.languages[0]) || navigator.language || "";
          var lang =
            storedLang === "zh-CN" || storedLang === "en-US"
              ? storedLang
              : browser.toLowerCase().indexOf("zh") === 0
                ? "zh-CN"
                : "en-US";
          document.documentElement.lang = lang;
        } catch (error) {
          /* storage can be unavailable in hardened browsers */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
