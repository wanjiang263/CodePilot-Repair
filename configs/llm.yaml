# LLM 接入配置。
#
# 三条硬规则（来自 docs/02-实现方案.md「多 Provider 接入」与 docs/03-AGENTS.md「LLM 边界」）：
#   1. 代码里不出现任何具体模型名。换模型只改这个文件。
#   2. 密钥只写环境变量名（api_key_env），值放 .env，绝不写在这里。
#   3. 业务代码里不写 `if provider == "..."`。能力差异用下面的能力字段表达。
#
# 模型与单价核实日期：DeepSeek / Kimi 2026-10-09，GLM 2026-10-17；来源与估算口径见
# docs/llm-config.md 与 docs/notes/glm-integration.md。
# 单价均为每百万 token；币种写在每个模型的 price.currency 里（BigModel 是 CNY，
# Z.AI 是 USD，两者不可混记进同一张预算表）。分时或分档计费取公开最高档用于预算估算，
# 不代表实际账单；厂商调整后只需更新此文件。
# 用 `uv run codepilot config check` 检查缺失密钥、模型、价格与币种汇率。

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 4
    timeout_seconds: 120

  kimi:
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    max_concurrency: 3
    timeout_seconds: 120

  # ---- 智谱 GLM：两个官方平台，两个标准 API 端点 ----
  # bigmodel.cn（中国站，CNY 计价）与 api.z.ai（国际站，USD 计价）。
  # 两家都接受 Authorization: Bearer <API Key>，但**官方明确写了标准 API 与
  # Coding Plan 的密钥互不通用**，且两家的标价数字并不一致，因此必须分成两个
  # provider，绝不能拿同一个 base_url 去试。这里的地址只是 codepilot/llm/glm.py
  # 里平台画像的一份副本；GLM_PLATFORM / GLM_BASE_URL 覆盖时以画像为准。
  #
  # 刻意**不**收录的端点：/api/coding/paas/v4（套餐端点，按积分计费，且会把
  # glm-4.7 这类历史模型自动改写到别的模型上）、/api/anthropic、/api/v1。
  # 把它们接到这个客户端上，症状是费用口径整段失真而报表上看不出来。
  # 一个平台一条 provider 记录：同一个端点留两个名字（旧名 glm）会让"这次跑的到底是
  # 哪份配置"变成猜谜，而 provider_config_hash 恰好要求它唯一。
  # 旧 provider 名 glm 已改名为 bigmodel，模型别名 glm-main 保持不变。
  bigmodel:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
    api_key_env_fallback: ZHIPU_API_KEY
    max_concurrency: 4
    timeout_seconds: 120
    # 官方限流文档没有 Retry-After，也没有承诺幂等；重试只针对 429/5xx。
    # 2026-10-18 E-10 全量批跑实测：并发 2 时持续触发 429，2 次重试不够；
    # 并发降到 1 并把重试提到 4 次，给短时限流窗口留出退避余量。
    max_retries: 4

  zai:
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: GLM_API_KEY
    max_concurrency: 4
    timeout_seconds: 120
    max_retries: 2

  # 保留位：任何兼容 OpenAI Chat Completions 协议的服务都可以这样接进来。
  # 启用前请先在 .env 中设置 OPENAI_API_KEY，并填写 models 下的 model 字段。
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_concurrency: 4
    timeout_seconds: 120

models:
  # key 是本项目内的模型别名，roles 段引用的是它，不是官方模型 ID。
  deepseek-chat:
    provider: deepseek
    # https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
    model: deepseek-flash
    context_window: 1000000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: true
    max_output_tokens: 4096
    # https://api-docs.deepseek.com/zh-cn/guides/thinking_mode/
    # 官方默认开启思考；显式关闭以兼容短输出预算及现有 Agent 消息协议。
    extra_body:
      thinking:
        type: disabled
    price:
      currency: CNY
      # 高峰价；闲时价格更低。预算估算保持保守。
      input_per_mtok: 2.0
      output_per_mtok: 8.0
      cached_input_per_mtok: 0.04

  kimi-main:
    provider: kimi
    # https://platform.kimi.com/ 与 /docs/guide/kimi-k2-6-quickstart
    model: kimi-k2.6
    context_window: 256000
    supports_tools: true
    supports_json_mode: true
    # 温度只接受模式固定值；省略参数，使用服务端对应模式的默认值。
    supports_temperature: false
    max_output_tokens: 4096
    extra_body:
      thinking:
        type: disabled
    price:
      currency: CNY
      input_per_mtok: 6.5
      output_per_mtok: 27.0
      cached_input_per_mtok: 1.1

  glm-main:
    provider: bigmodel
    # https://docs.bigmodel.cn/cn/guide/models/text/glm-4.7
    model: glm-4.7
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: true
    supports_thinking: true
    max_output_tokens: 4096
    # 思考开关逐模型不同：4.7 系可以关，GLM-5 系关不掉（官方如此声明，实测见
    # docs/notes/glm-integration.md）。因此它写在别名的 extra_body 里，而不是由
    # 代码按厂商猜。supports_thinking: false 会让这两个参数在构造请求体时被摘掉。
    extra_body:
      thinking:
        type: disabled
    price:
      currency: CNY
      # https://docs.bigmodel.cn/cn/guide/start/pricing
      # glm-4.7 同时按**输入长度**与**输出长度**分档：
      #   输入[0,32K) 输出[0,0.2K) → 2/8，缓存 0.4
      #   输入[0,32K) 输出≥0.2K   → 3/14，缓存 0.6
      #   输入[32K,200K)          → 4/16，缓存 0.8
      # 单任务无法预知落在哪一档，取公开最高档用于预算估算（保守，偏高）。
      # 缓存命中价是**替换价**（官方："缓存命中 Token：按优惠价格计费"），不是额外加价；
      # 另有"缓存存储费用"当前标注限时免费，无法计量，因此这里的数字不等于账单。
      input_per_mtok: 4.0
      output_per_mtok: 16.0
      cached_input_per_mtok: 0.8

  # GLM-5 系：思考模式无法关闭，输出预算要留够；温度参数对 5.1 有取值限制，
  # 因此不发温度，交给服务端默认值（写在能力字段里，不在代码里按模型名分支）。
  glm-5-main:
    provider: bigmodel
    model: glm-5
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: false
    max_output_tokens: 4096
    price:
      currency: CNY
      # 输入[0,32K) 4/18，输入≥32K 6/22，缓存 1 / 1.5（取高档）
      input_per_mtok: 6.0
      output_per_mtok: 22.0
      cached_input_per_mtok: 1.5

  glm-5.1-main:
    provider: bigmodel
    model: glm-5.1
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: false
    max_output_tokens: 4096
    price:
      currency: CNY
      # 输入[0,32K) 6/24，输入≥32K 8/28，缓存 1.3 / 2（取高档）
      input_per_mtok: 8.0
      output_per_mtok: 28.0
      cached_input_per_mtok: 2.0

  # ---- 1M 上下文的 GLM-5.3 ----
  # 两家定价表都列了它（BigModel 不分档：8/28，缓存 2；Z.AI：1.4/4.4，缓存 0.26）。
  # 官方文档说 5.2/5.3 可以用 reasoning_effort 把思考降到 none，但这条**未实测**，
  # 因此这里同样不下发思考参数：宁可用服务端默认，也不要拿一个没验证过的参数去打真实
  # 付费请求。账户是否有权调用由 `codepilot llm smoke` 如实报告。
  glm-5.3-main:
    provider: bigmodel
    model: glm-5.3
    context_window: 1000000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: false
    max_output_tokens: 4096
    price:
      currency: CNY
      input_per_mtok: 8.0
      output_per_mtok: 28.0
      cached_input_per_mtok: 2.0

  # GLM-5.3-Flash：当前 BigModel 账号的资源包只覆盖 flash/flashx（2026-10-18 实测
  # glm-4.7 返回 1113「余额不足或无可用资源包」）。flash 强制思考、不能用
  # thinking.type=disabled；必须用 reasoning_effort（low/high/max）。工具调用与
  # JSON 模式已实测可用（200）。单价来源：https://docs.bigmodel.cn/cn/guide/start/pricing
  # 2026-10-18：输入 0.8 / 输出 2.8 / 缓存命中 0.23（元/百万 tokens），1M 上下文。
  glm-5.3-flash-main:
    provider: bigmodel
    model: glm-5.3-flash
    context_window: 1000000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: true
    max_output_tokens: 4096
    # 强制思考：low 用来压低思考 token；supports_thinking=false 会把该参数摘掉。
    extra_body:
      reasoning_effort: low
    price:
      currency: CNY
      input_per_mtok: 0.8
      output_per_mtok: 2.8
      cached_input_per_mtok: 0.23


  # ---- Z.AI 国际站：同一批模型，公开计价以 **USD** 结算 ----
  # 币种不能混：把 USD 单价直接当成 CNY 记进预算会低估约七倍。要么在
  # exchange_rates 里显式声明 USD 汇率，要么把 budget_currency 设成 USD。
  # 未声明时 `codepilot config check` 与 live 冒烟都会拒绝放行。
  # Z.AI 的定价表**不分档**，所以下面的数字既是普通档也是最高档。
  glm-4.7-zai:
    provider: zai
    model: glm-4.7
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: true
    supports_thinking: true
    max_output_tokens: 4096
    extra_body:
      thinking:
        type: disabled
    price:
      currency: USD
      input_per_mtok: 0.6
      output_per_mtok: 2.2
      cached_input_per_mtok: 0.11

  # glm-5.3 的可用性由 2026-10-17 的真实 API 冒烟确认（Z.AI 三阶段全部通过）：
  # 此前一份资料断言它还不存在，实测推翻了那个说法。1M 上下文按两家模型页配置。
  glm-5.3-zai:
    provider: zai
    model: glm-5.3
    context_window: 1000000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: false
    max_output_tokens: 4096
    price:
      currency: USD
      input_per_mtok: 1.4
      output_per_mtok: 4.4
      cached_input_per_mtok: 0.26

  glm-5-zai:
    provider: zai
    model: glm-5
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: false
    max_output_tokens: 4096
    price:
      currency: USD
      input_per_mtok: 1.0
      output_per_mtok: 3.2
      cached_input_per_mtok: 0.2

  glm-5.1-zai:
    provider: zai
    model: glm-5.1
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: false
    supports_thinking: false
    max_output_tokens: 4096
    price:
      currency: USD
      input_per_mtok: 1.4
      output_per_mtok: 4.4
      cached_input_per_mtok: 0.26


# 每个 Agent 角色使用哪个模型别名。
# 角色名固定为这 8 个（见 codepilot/llm/config.py 的 KNOWN_ROLES），
# 拼错会在 `codepilot config check` 里报出来。
roles:
  issue_analyzer: deepseek-chat
  localizer: deepseek-chat
  planner: deepseek-chat
  coder: deepseek-chat
  reproducer: deepseek-chat
  diagnoser: deepseek-chat
  reviewer: deepseek-chat
  failure_classifier: deepseek-chat

# 数据外发白名单（02「数据外发」）。
# 非 null 时，未列出的 provider 会直接拒绝调用，防止私有仓库代码
# 因为一次误配被发到未授权的服务商。
# allowed_providers:
#   - deepseek

# 汇率：币种 -> 1 单位该币种等于多少 budget_currency（默认 CNY）。
# 仅用于把不同 provider 的费用统一到同一币种后比较预算。
# 缺汇率的币种按 1.0 处理，并在 Run Report 中标注。
exchange_rates:
  CNY: 1.0
