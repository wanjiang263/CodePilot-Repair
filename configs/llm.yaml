# LLM 接入配置。
#
# 三条硬规则（来自 docs/02-实现方案.md「多 Provider 接入」与 docs/03-AGENTS.md「LLM 边界」）：
#   1. 代码里不出现任何具体模型名。换模型只改这个文件。
#   2. 密钥只写环境变量名（api_key_env），值放 .env，绝不写在这里。
#   3. 业务代码里不写 `if provider == "..."`。能力差异用下面的能力字段表达。
#
# 模型与单价核实日期：2026-10-09；来源与估算口径见 docs/llm-config.md。
# 单价均为 CNY / 百万 token。分时或分档计费取公开最高档用于预算估算，
# 不代表实际账单；厂商调整后只需更新此文件。
# 用 `uv run codepilot config check` 检查缺失密钥、模型与价格。

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 4
    timeout_seconds: 120

  kimi:
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    max_concurrency: 3
    timeout_seconds: 120

  glm:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    max_concurrency: 4
    timeout_seconds: 120

  # 保留位：任何兼容 OpenAI Chat Completions 协议的服务都可以这样接进来。
  # 启用前请先在 .env 中设置 OPENAI_API_KEY，并填写 models 下的 model 字段。
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_concurrency: 4
    timeout_seconds: 120

models:
  # key 是本项目内的模型别名，roles 段引用的是它，不是官方模型 ID。
  deepseek-chat:
    provider: deepseek
    # https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
    model: deepseek-flash
    context_window: 1000000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: true
    max_output_tokens: 4096
    # https://api-docs.deepseek.com/zh-cn/guides/thinking_mode/
    # 官方默认开启思考；显式关闭以兼容短输出预算及现有 Agent 消息协议。
    extra_body:
      thinking:
        type: disabled
    price:
      currency: CNY
      # 高峰价；闲时价格更低。预算估算保持保守。
      input_per_mtok: 2.0
      output_per_mtok: 8.0
      cached_input_per_mtok: 0.04

  kimi-main:
    provider: kimi
    # https://platform.kimi.com/ 与 /docs/guide/kimi-k2-6-quickstart
    model: kimi-k2.6
    context_window: 256000
    supports_tools: true
    supports_json_mode: true
    # 温度只接受模式固定值；省略参数，使用服务端对应模式的默认值。
    supports_temperature: false
    max_output_tokens: 4096
    extra_body:
      thinking:
        type: disabled
    price:
      currency: CNY
      input_per_mtok: 6.5
      output_per_mtok: 27.0
      cached_input_per_mtok: 1.1

  glm-main:
    provider: glm
    # https://docs.bigmodel.cn/cn/guide/models/text/glm-4.7
    model: glm-4.7
    context_window: 200000
    supports_tools: true
    supports_json_mode: true
    supports_temperature: true
    max_output_tokens: 4096
    extra_body:
      thinking:
        type: disabled
    price:
      currency: CNY
      # https://docs.bigmodel.cn/cn/guide/start/pricing，取长输入最高档。
      input_per_mtok: 4.0
      output_per_mtok: 16.0
      cached_input_per_mtok: 0.8

# 每个 Agent 角色使用哪个模型别名。
# 角色名固定为这 8 个（见 codepilot/llm/config.py 的 KNOWN_ROLES），
# 拼错会在 `codepilot config check` 里报出来。
roles:
  issue_analyzer: deepseek-chat
  localizer: deepseek-chat
  planner: deepseek-chat
  coder: deepseek-chat
  reproducer: deepseek-chat
  diagnoser: deepseek-chat
  reviewer: deepseek-chat
  failure_classifier: deepseek-chat

# 数据外发白名单（02「数据外发」）。
# 非 null 时，未列出的 provider 会直接拒绝调用，防止私有仓库代码
# 因为一次误配被发到未授权的服务商。
# allowed_providers:
#   - deepseek

# 汇率：币种 -> 1 单位该币种等于多少 budget_currency（默认 CNY）。
# 仅用于把不同 provider 的费用统一到同一币种后比较预算。
# 缺汇率的币种按 1.0 处理，并在 Run Report 中标注。
exchange_rates:
  CNY: 1.0
