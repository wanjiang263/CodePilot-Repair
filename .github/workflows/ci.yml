name: CI

permissions:
  contents: read

# 04 通用完成标准：ruff + mypy + 非 docker、非 llm 的 pytest。
# Phase 1 的真实 Docker 验收独立运行，缺 daemon / 全部 skip 均不算通过。
# 真实 LLM 的验收（@pytest.mark.llm）永不进入 CI（03 §22）。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

# Explicit bash enables pipefail, so preserving output with tee cannot hide failures.
defaults:
  run:
    shell: bash

jobs:
  browser:
    name: browser E2E (Chromium, offline worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-evidence
          path: output/playwright/

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: web

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
      - run: uv python install 3.12
      - run: uv build
      - name: Install wheel in an isolated environment
        run: |
          uv venv --python 3.12 /tmp/codepilot-package-check
          uv pip install --python /tmp/codepilot-package-check/bin/python dist/*.whl
          cd /tmp
          /tmp/codepilot-package-check/bin/codepilot --version
          /tmp/codepilot-package-check/bin/python -I - <<'PY'
          from codepilot.config import Settings
          from codepilot.eval.swebench import _default_env_spec_snapshot
          settings = Settings(_env_file=None)
          assert settings.resolved_llm_config.is_file()
          assert (settings.api_demo_root / 'mini_calc' / 'pyproject.toml').is_file()
          assert settings.readme_path.is_file()
          assert _default_env_spec_snapshot().is_file()
          PY

  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.9"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Environment
        run: uv run python -c "import platform; from importlib.metadata import version; print(platform.platform()); print(platform.python_version()); print('tree-sitter', version('tree-sitter')); print('tree-sitter-python', version('tree-sitter-python'))" | tee environment.log

      - name: Ruff
        run: uv run ruff check . 2>&1 | tee ruff-check.log

      - name: Ruff format check
        run: uv run ruff format --check . 2>&1 | tee ruff-format.log

      - name: mypy
        run: uv run mypy src 2>&1 | tee mypy.log

      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: '*.log'

  test:
    name: pytest (no docker, no llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.9"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # Exercise the optional native backend, while runtime installation stays optional.
        run: uv sync --frozen --extra dev --extra faiss --python 3.12

      - name: Environment
        run: uv run python -c "import platform; from importlib.metadata import version; print(platform.platform()); print(platform.python_version()); print('tree-sitter', version('tree-sitter')); print('tree-sitter-python', version('tree-sitter-python'))" | tee environment.log

      - name: pytest
        # V-04 tests exercise the real executable, never silently skip the channel.
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          uv run pytest -m "not docker and not llm" --cov --cov-report=term-missing --junitxml=pytest-results.xml 2>&1 | tee pytest.log

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-evidence
          path: |
            environment.log
            pytest.log
            pytest-results.xml

  docker:
    name: Phase 1 index in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.9"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Environment
        run: uv run python -c "import platform; from importlib.metadata import version; print(platform.platform()); print(platform.python_version()); print('tree-sitter', version('tree-sitter')); print('tree-sitter-python', version('tree-sitter-python'))" | tee environment.log

      - name: Require a working Docker daemon
        run: docker info --format '{{.ServerVersion}}' 2>&1 | tee docker-info.log

      - name: Docker acceptance
        run: uv run pytest -s -m docker --junitxml=docker-results.xml 2>&1 | tee docker-test.log

      - name: Require executed Docker tests
        run: |
          uv run python - <<'PY'
          from xml.etree import ElementTree
          cases = ElementTree.parse('docker-results.xml').findall('.//testcase')
          assert cases, 'No Docker tests collected'
          assert all(case.find('skipped') is None for case in cases), 'Docker tests skipped'
          PY

      - name: Preserve Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence
          path: |
            environment.log
            docker-info.log
            docker-test.log
            docker-results.xml
