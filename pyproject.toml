# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ 是设计文档，不是代码。新版 ruff 会连 Markdown 里的 ```python 代码块
# 一起格式化，而 02 的示例刻意用对齐注释（`cost: float      # ...`）标注
# 字段含义，格式化会把这些对齐压掉，让文档变难读。文档不该被代码格式化器管。
extend-exclude = ["tests/fixtures", "benchmarks/synthetic", "artifacts", "docs", ".codex-pytest-tmp"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # unused arguments
    "PTH", # flake8-use-pathlib
    "G",   # flake8-logging-format
    "LOG", # flake8-logging
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行长度由 formatter 处理
    "B008",   # Typer / FastAPI 依赖注入惯用法
    "RUF001", # 中文全角标点在字符串中是刻意的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]
"docs/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["codepilot"]

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "rank_bm25.*",
    "tiktoken.*",
    "docker.*",
    "sentence_transformers.*",
    "faiss.*",
    "swebench.*",
    "datasets.*",
    "langgraph.*",
    "networkx.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# tests/fixtures/repos/ 下是**被解析的对象**，不是被测代码。它们长得就像真
# 仓库——`tests/test_session.py`、`conftest.py` 一应俱全，其中一个还故意带
# 语法错误。不排除的话 pytest 会去收集它们：轻则多出一堆无夹具的失败，
# 重则在导入 `calc/broken.py` 时直接 SyntaxError 让整次收集崩掉。
norecursedirs = ["fixtures"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300
markers = [
    "docker: 需要可用的 Docker daemon（不可用时自动 skip）",
    "llm: 需要真实 LLM API key（CI 中永不运行）",
    "slow: 长耗时测试",
]
log_cli_level = "INFO"

# ----------------------------------------------------------------------------
# coverage（NFR-03：核心模块行覆盖率 >= 80%）
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["codepilot"]
branch = true
omit = ["*/tests/*", "*/cli.py"]

[tool.coverage.report]
# X-07 的覆盖率门禁。写在配置里而不是只写在文档里：没有 fail_under 的
# 覆盖率要求是一句口号，读数再低 CI 也是绿的。
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # 只排除空实现的省略号，不能匹配 tuple[Symbol, ...] 等类型注解。
    "^\\s*(?:\\.\\.\\.|(?:async\\s+)?def\\b.*:\\s*\\.\\.\\.)\\s*(?:#.*)?$",
]
