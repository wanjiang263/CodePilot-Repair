[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codepilot-repair"
version = "0.1.0"
description = "Repository-level autonomous software engineering agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "CodePilot-Repair" }]
keywords = ["software-engineering-agent", "automated-program-repair", "llm", "swe-bench"]

dependencies = [
    # CLI / 配置
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # LLM 调用层（02「多 Provider 接入」兼容性测试明确要求 httpx.MockTransport）
    "httpx[socks]>=0.27",
    # 存储与可观测
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    # Repository Intelligence
    # 0.26.0 Point.row/column return borrowed references and corrupt memory on
    # real repositories. R-23 reproducer and evidence: docs/notes/phase1.md.
    "tree-sitter==0.26.1",
    "tree-sitter-python==0.25.0",
    "networkx>=3.3",
    # Retrieval
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    # Context 构造
    "tiktoken>=0.7",
    # Sandbox
    "docker>=7.1",
    # LangGraph 编排
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    # Run Report / 静态 HTML 报告降级
    "jinja2>=3.1",
    # API（Phase 13；Phase 0 只用到 GET /health）
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "cryptography>=43",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.7", "transformers>=5.22.1,<6"]
faiss = ["faiss-cpu>=1.8"]
swebench = [
    "swebench==4.1.0",
    "datasets>=5.0.1,<6",
    "huggingface-hub>=1.31,<3",
    "pyarrow>=15",
]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
bedrock = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
codepilot = "codepilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.hatch.build.targets.wheel.force-include]
